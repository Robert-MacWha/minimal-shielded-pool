name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the runs it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-pins:
    # Reports, never fails: the proofs in soispoke/verified-shielded-pool cover
    # one pinned commit, and this lists the pinned files a change touches.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pin check imports no packages, so it needs no npm install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Report changes to formally verified files
        run: node tools/check-formal-pins.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just@1.58.0

      - name: Install pinned dependencies
        run: just install

      - name: Reject high dependency advisories
        run: npm audit --omit=dev --audit-level=high

      # The checks themselves live in the justfile, so CI and `just test` run
      # the same list.
      - name: Check generated artifacts
        run: just check-artifacts

      - name: Type, format, gas, activation and compiler-settings checks
        run: just check

      - name: TypeScript tests
        run: just test-ts

      - name: Test contracts
        run: just test-contracts

  # package.json allows Node 24.7, the first release with ML-KEM in node:crypto,
  # so the TypeScript tests also run on exactly that version.
  oldest-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.7.0
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: npm ci
      # Building the contracts installs solc 0.8.30, which the dispatcher test compiles with.
      - run: forge build --root core/contracts
      - name: TypeScript tests
        run: node --test test/*.test.ts

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lambdaclass/ethrex
          ref: 247e2dd2c4d4c526dcc64ac1c025bd2319e7a10e
          path: .native-ethrex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: Install native test dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          npm ci
      # run.ts rewrites the tracked reports, so keep the committed ones to compare against.
      - name: Keep the committed reports
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp test/native/native-report.json test/native/policy-report.json "$RUNNER_TEMP/committed/"
      # --cache-only builds every fixture from the committed proofs, so the run is byte for
      # byte reproducible, and a changed witness fails here until its new proof is committed.
      - name: Test duplicate notes, reorgs, settlement gas and client policy
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/msp-occurrence-target
        run: node test/native/run.ts --cache-only --ethrex-source "$GITHUB_WORKSPACE/.native-ethrex"
      - name: Check the run reproduces the committed reports
        run: node test/native/compare-reports.ts "$RUNNER_TEMP/committed" test/native
