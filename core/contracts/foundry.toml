[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
# LibSkewMmr and LibSkewMmrVerifier come from the pinned @skew-mmr/contracts that npm ci installs.
remappings = ["skew-mmr/=../../node_modules/@skew-mmr/contracts/src/"]
allow_paths = ["../../node_modules/@skew-mmr/contracts"]
solc_version = "0.8.30"
optimizer = true
# 5000 runs, not the default 200. Via IR at 200 to 1,000 runs, this profile's PoseidonT3
# and PoseidonT4 cost about 42,000 and 63,000 gas per hash; from 2,000 runs up they cost
# 32,000 and 44,000 (solc 0.8.30, including the library call). The Forge tests run these
# builds, while the deployed libraries come from the libsmall profile below. The setting
# also applies to ShieldedPoolLogic and the verifier, which deploy from this profile.
optimizer_runs = 5000
via_ir = true
# The Forge tests read the Poseidon vectors and the smoke fixture.
fs_permissions = [
    { access = "read", path = "../../test/vectors" },
    { access = "read", path = "../../test/fixtures" },
]

# Legacy codegen for PoseidonT3 and PoseidonT4, which tools/run_live_dispatcher.sh deploys
# from this profile; everything else uses the default profile. PoseidonT4's runtime,
# metadata included, is 11,440 bytes via IR and 9,262 bytes here. At the hegota devnet's
# EIP-8037 code deposit cost of about 1,545 gas per byte, only the smaller fits its 2^24
# per-transaction gas cap.
[profile.libsmall]
src = "src"
out = "out-libsmall"
libs = []
# LibSkewMmr and LibSkewMmrVerifier come from the pinned @skew-mmr/contracts that npm ci installs.
remappings = ["skew-mmr/=../../node_modules/@skew-mmr/contracts/src/"]
allow_paths = ["../../node_modules/@skew-mmr/contracts"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = false
# Only the two Poseidon libraries are deployed from this profile, so skip tests.
skip = ["test/**"]
